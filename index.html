<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FocusFlow // Productivity Hub</title>
    <!-- Fonts & Icons -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    
    <style>
        :root {
            --primary: #6366f1;
            --primary-hover: #4f46e5;
            --bg-dark: #0f172a;
            --card-glass: rgba(255, 255, 255, 0.08);
            --border-glass: rgba(255, 255, 255, 0.12);
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --radius: 20px;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Plus Jakarta Sans', sans-serif;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow-x: hidden;
        }

        /* --- CANVAS DROP BALL BACKGROUND --- */
        #bg-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            background: radial-gradient(circle at top right, #1e1b4b, #0f172a);
        }

        /* --- HEADER --- */
        header {
            padding: 30px 5%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            backdrop-filter: blur(10px);
            border-bottom: 1px solid var(--border-glass);
            z-index: 10;
        }

        .brand h1 {
            font-size: 1.5rem;
            font-weight: 700;
            letter-spacing: -0.5px;
            background: linear-gradient(to right, #818cf8, #c084fc);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .header-info {
            text-align: right;
            display: flex;
            align-items: center;
            gap: 20px;
        }

        #time {
            font-size: 1.4rem;
            font-weight: 600;
            color: #fff;
        }

        /* --- DASHBOARD GRID --- */
        main {
            display: grid;
            grid-template-columns: 320px 1fr 320px;
            gap: 25px;
            padding: 40px 5%;
            max-width: 1600px;
            margin: 0 auto;
            width: 100%;
            flex: 1;
        }

        @media (max-width: 1200px) {
            main { grid-template-columns: 1fr 1.5fr; }
            .notes-panel { grid-column: span 2; }
        }

        @media (max-width: 850px) {
            main { grid-template-columns: 1fr; }
            .notes-panel, .calendar-panel { grid-column: span 1; }
        }

        .panel {
            background: var(--card-glass);
            backdrop-filter: blur(20px);
            border-radius: var(--radius);
            padding: 25px;
            border: 1px solid var(--border-glass);
            box-shadow: 0 20px 50px rgba(0,0,0,0.3);
        }

        h2 {
            font-size: 1rem;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            color: var(--text-muted);
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        /* --- CALENDAR --- */
        .calendar-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 5px;
            text-align: center;
        }

        .cal-day { font-size: 0.75rem; color: var(--primary); font-weight: 700; padding-bottom: 10px; }
        .cal-date {
            padding: 10px 0;
            font-size: 0.85rem;
            border-radius: 10px;
            transition: 0.3s;
            cursor: default;
        }

        .cal-date.active {
            background: var(--primary);
            color: white;
            box-shadow: 0 0 20px rgba(99, 102, 241, 0.4);
        }

        /* --- TODO LIST --- */
        .input-group {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        input {
            flex: 1;
            background: rgba(255,255,255,0.05);
            border: 1px solid var(--border-glass);
            border-radius: 12px;
            padding: 12px 15px;
            color: white;
            outline: none;
            transition: 0.3s;
        }

        input:focus { border-color: var(--primary); background: rgba(255,255,255,0.1); }

        .btn-icon {
            background: var(--primary);
            border: none;
            color: white;
            width: 45px;
            height: 45px;
            border-radius: 12px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: 0.3s;
        }

        .btn-icon:hover { background: var(--primary-hover); transform: scale(1.05); }

        .todo-item {
            background: rgba(255,255,255,0.03);
            border-radius: 14px;
            padding: 15px;
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 10px;
            border: 1px solid transparent;
            transition: 0.3s;
            animation: slideIn 0.3s ease;
        }

        .todo-item:hover { border-color: var(--border-glass); background: rgba(255,255,255,0.06); }

        .todo-item.completed { opacity: 0.5; }
        .todo-item.completed span { text-decoration: line-through; }

        /* --- STICKY NOTES --- */
        .notes-grid {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .note {
            padding: 18px;
            border-radius: 16px;
            min-height: 120px;
            color: #1e293b;
            position: relative;
        }

        .note textarea {
            background: transparent;
            border: none;
            width: 100%;
            height: 80px;
            resize: none;
            outline: none;
            font-weight: 600;
            color: inherit;
        }

        .note-header {
            display: flex;
            justify-content: space-between;
            margin-bottom: 10px;
        }

        /* --- FOOTER --- */
        footer {
            padding: 30px;
            text-align: center;
            border-top: 1px solid var(--border-glass);
            background: rgba(15, 23, 42, 0.8);
            backdrop-filter: blur(10px);
        }

        footer p {
            color: var(--text-muted);
            font-size: 0.85rem;
            letter-spacing: 1px;
        }

        footer b { color: var(--primary); }

        @keyframes slideIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

    </style>
</head>
<body>

    <canvas id="bg-canvas"></canvas>

    <header>
        <div class="brand">
            <h1>FocusFlow</h1>
        </div>
        <div class="header-info">
            <div>
                <div id="time">00:00:00</div>
                <div id="date" style="color: var(--text-muted); font-size: 0.8rem; font-weight: 600;">LOADING...</div>
            </div>
            <i data-lucide="shield-check" style="color: var(--primary)"></i>
        </div>
    </header>

    <main>
        <!-- Panel 1: Calendar -->
        <div class="panel calendar-panel">
            <h2><i data-lucide="calendar" size="18"></i> Schedule</h2>
            <div class="calendar-grid" id="calendar">
                <div class="cal-day">S</div><div class="cal-day">M</div>
                <div class="cal-day">T</div><div class="cal-day">W</div>
                <div class="cal-day">T</div><div class="cal-day">F</div>
                <div class="cal-day">S</div>
            </div>
        </div>

        <!-- Panel 2: Todo -->
        <div class="panel">
            <h2><i data-lucide="list-todo" size="18"></i> Active Tasks</h2>
            <div class="input-group">
                <input type="text" id="todo-input" placeholder="Plan your next move...">
                <button class="btn-icon" onclick="addTodo()">
                    <i data-lucide="plus"></i>
                </button>
            </div>
            <div id="todo-list"></div>
        </div>

        <!-- Panel 3: Notes -->
        <div class="panel notes-panel">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
                <h2><i data-lucide="sticky-note" size="18"></i> Fragments</h2>
                <div style="display: flex; gap: 8px;">
                    <div onclick="addNote('#fef08a')" style="width:12px; height:12px; border-radius:50%; background:#fef08a; cursor:pointer"></div>
                    <div onclick="addNote('#bfdbfe')" style="width:12px; height:12px; border-radius:50%; background:#bfdbfe; cursor:pointer"></div>
                    <div onclick="addNote('#bbf7d0')" style="width:12px; height:12px; border-radius:50%; background:#bbf7d0; cursor:pointer"></div>
                </div>
            </div>
            <div class="notes-grid" id="notes-container"></div>
        </div>
    </main>

    <footer>
        <p><b>FocusFlow</b> // Developed and Deployed by <b>Md Istiak Islam</b></p>
    </footer>

    <script>
        // --- 1. ENHANCED DROP BALL ANIMATION ---
        const canvas = document.getElementById('bg-canvas');
        const ctx = canvas.getContext('2d');
        let particles = [];

        function initCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', initCanvas);
        initCanvas();

        class Particle {
            constructor() {
                this.init();
            }
            init() {
                this.x = Math.random() * canvas.width;
                this.y = -50 - (Math.random() * canvas.height);
                this.radius = Math.random() * 4 + 2;
                this.speed = Math.random() * 1.5 + 0.5;
                this.alpha = Math.random() * 0.3;
            }
            update() {
                this.y += this.speed;
                if (this.y > canvas.height + 10) this.init();
            }
            draw() {
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
                ctx.fillStyle = `rgba(129, 140, 248, ${this.alpha})`;
                ctx.fill();
            }
        }

        for (let i = 0; i < 60; i++) particles.push(new Particle());

        function animate() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            particles.forEach(p => { p.update(); p.draw(); });
            requestAnimationFrame(animate);
        }
        animate();

        // --- 2. CLOCK & DATE ---
        function updateTime() {
            const now = new Date();
            document.getElementById('time').innerText = now.toLocaleTimeString([], { hour12: false });
            document.getElementById('date').innerText = now.toLocaleDateString(undefined, { weekday: 'long', month: 'short', day: 'numeric' }).toUpperCase();
        }
        setInterval(updateTime, 1000);
        updateTime();

        // --- 3. CALENDAR ---
        function generateCalendar() {
            const cal = document.getElementById('calendar');
            const now = new Date();
            const daysInMonth = new Date(now.getFullYear(), now.getMonth() + 1, 0).getDate();
            const startDay = new Date(now.getFullYear(), now.getMonth(), 1).getDay();

            for (let i = 0; i < startDay; i++) cal.innerHTML += `<div></div>`;
            for (let d = 1; d <= daysInMonth; d++) {
                const isToday = d === now.getDate() ? 'active' : '';
                cal.innerHTML += `<div class="cal-date ${isToday}">${d}</div>`;
            }
        }
        generateCalendar();

        // --- 4. TODO (Storage) ---
        let tasks = JSON.parse(localStorage.getItem('ff_tasks')) || [];
        function renderTasks() {
            localStorage.setItem('ff_tasks', JSON.stringify(tasks));
            const list = document.getElementById('todo-list');
            list.innerHTML = tasks.map((t, i) => `
                <div class="todo-item ${t.done ? 'completed' : ''}">
                    <i data-lucide="${t.done ? 'check-circle' : 'circle'}" onclick="toggleTask(${i})" style="cursor:pointer; color:var(--primary)"></i>
                    <span style="flex:1">${t.text}</span>
                    <i data-lucide="trash-2" size="16" onclick="deleteTask(${i})" style="cursor:pointer; color:var(--text-muted)"></i>
                </div>
            `).join('');
            lucide.createIcons();
        }

        function addTodo() {
            const input = document.getElementById('todo-input');
            if (!input.value) return;
            tasks.unshift({ text: input.value, done: false });
            input.value = '';
            renderTasks();
        }

        function toggleTask(i) { tasks[i].done = !tasks[i].done; renderTasks(); }
        function deleteTask(i) { tasks.splice(i, 1); renderTasks(); }

        // --- 5. NOTES (Storage) ---
        let notes = JSON.parse(localStorage.getItem('ff_notes')) || [];
        function renderNotes() {
            localStorage.setItem('ff_notes', JSON.stringify(notes));
            const container = document.getElementById('notes-container');
            container.innerHTML = notes.map((n, i) => `
                <div class="note" style="background: ${n.color}">
                    <div class="note-header">
                        <i data-lucide="hash" size="14"></i>
                        <i data-lucide="x" size="14" onclick="deleteNote(${i})" style="cursor:pointer"></i>
                    </div>
                    <textarea oninput="updateNote(${i}, this.value)" placeholder="Brainstorm...">${n.text}</textarea>
                </div>
            `).join('');
            lucide.createIcons();
        }

        function addNote(color) { notes.unshift({ text: '', color: color }); renderNotes(); }
        function updateNote(i, val) { notes[i].text = val; localStorage.setItem('ff_notes', JSON.stringify(notes)); }
        function deleteNote(i) { notes.splice(i, 1); renderNotes(); }

        // Initialize
        renderTasks();
        renderNotes();
        lucide.createIcons();

        // Enter key listeners
        document.getElementById('todo-input').addEventListener('keypress', (e) => { if(e.key === 'Enter') addTodo(); });

    </script>
</body>
</html>
